[pytest]
pythonpath = .
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning:core\.rag\..*
    ignore::DeprecationWarning:eval\..*
markers =
    unit: быстрые unit-тесты, без сети/Chroma/GPU.
    integration: тесты с живым Chroma/Ollama (CHROMA_INTEGRATION=1).
    regression: replay-режим стабильных метрик.
    gpu: требуют CUDA / pynvml.
    slow: legacy alias for regression/integration tests.
